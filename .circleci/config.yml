---
version: 2.1

parameters:
    run_workflow_deploy:
        type: boolean
        default: false

std-filters: &std-filters
    filters:
        branches:
            ignore:
            - devel
            - tmp
        tags:
            only: /.*/

workflows:
    build_all:
        when:
            not: << pipeline.parameters.run_workflow_deploy >>
        jobs:
## ----------------------
## OpenCPN 5.8 Plugins  (Also work in 5.10)
## ----------------------
          - build-android-arm64:
              <<: *std-filters
          - build-android-armhf:
                <<: *std-filters
          - build-flatpak-aarch64-2208:
              <<: *std-filters
          - build-flatpak-x86-2208:
              <<: *std-filters
          - build-flatpak-aarch64-2408:
              <<: *std-filters
          - build-flatpak-x86-2408:
              <<: *std-filters
          - build-msvc-wx32-2022:
              <<: *std-filters
          - build-debian-armhf-13-trixie:
              <<: *std-filters
          - build-debian-arm64-13-trixie:
              <<: *std-filters
          - build-debian-x86_64-13-trixie:
              <<: *std-filters
          - build-debian-arm64-12-bookworm:
              <<: *std-filters
          - build-debian-armhf-12-bookworm:
              <<: *std-filters
          - build-debian-x86_64-12-bookworm:
              <<: *std-filters
          - build-debian-armhf-11-bullseye:
              <<: *std-filters
          - build-debian-arm64-11-bullseye:
              <<: *std-filters
          - build-debian-x86_64-11-bullseye:
             <<: *std-filters
## KEEP needed for Jammy with wx32
          - build-ubuntu-x86_64-2204-jammy:
              <<: *std-filters
          - build-macos-universal:
              <<: *std-filters

## -------------------------------------------
## OpenCPN 5.6.2 Plugins  Frozen - 28/05/2023
## ------------------------------------------
## Circleci will not build for macos 11 so removed - 18/10/2023
          - build-msvc-2022:
              <<: *std-filters

    deploy_reviewed_alpha:
        when: << pipeline.parameters.run_workflow_deploy >>
        jobs:
          - build-android-arm64:
              name: release-android-arm64
              <<: *std-filters
          - build-android-armhf:
              name: release-android-armhf
              <<: *std-filters
          - build-flatpak-aarch64-2208:
              name: release-flatpak-aarch64-2208
              <<: *std-filters
          - build-flatpak-x86-2208:
              name: release-flatpak-x86-2208
              <<: *std-filters
          - build-flatpak-aarch64-2408:
              name: release-flatpak-aarch64-2408
              <<: *std-filters
          - build-flatpak-x86-2408:
              name: release-flatpak-x86-2408
              <<: *std-filters
          - build-msvc-wx32-2022:
              name: release-msvc-wx32-2022
              <<: *std-filters
          - build-debian-armhf-13-trixie:
              name: release-debian-armhf-13-trixie
              <<: *std-filters
          - build-debian-arm64-13-trixie:
              name: release-debian-arm64-13-trixie
              <<: *std-filters
          - build-debian-x86_64-13-trixie:
              name: release-debian-x86_64-13-trixie
              <<: *std-filters
          - build-debian-arm64-12-bookworm:
              name: release-debian-arm64-12-bookworm
              <<: *std-filters
          - build-debian-armhf-12-bookworm:
              name: release-debian-armhf-12-bookworm
              <<: *std-filters
          - build-debian-x86_64-12-bookworm:
              name: release-debian-x86_64-12-bookworm
              <<: *std-filters
          - build-debian-armhf-11-bullseye:
              name: release-debian-armhf-11-bullseye
              <<: *std-filters
          - build-debian-arm64-11-bullseye:
              name: release-debian-arm64-11-bullseye
              <<: *std-filters
          - build-debian-x86_64-11-bullseye:
              name: release-debian-x86_64-11-bullseye
              <<: *std-filters
          - build-ubuntu-x86_64-2204-jammy:
              name: release-ubuntu-x86_64-2204-jammy
              <<: *std-filters
          - build-macos-universal:
              name: release-macos-universal
              <<: *std-filters
          - build-msvc-2022:
              name: release-msvc-2022
              <<: *std-filters
          - hold-for-alpha-approval:
              type: approval
              requires:
                - release-android-arm64
                - release-android-armhf
                - release-flatpak-aarch64-2208
                - release-flatpak-x86-2208
                - release-flatpak-aarch64-2408
                - release-flatpak-x86-2408
                - release-msvc-wx32-2022
                - release-debian-armhf-13-trixie
                - release-debian-arm64-13-trixie
                - release-debian-x86_64-13-trixie
                - release-debian-arm64-12-bookworm
                - release-debian-armhf-12-bookworm
                - release-debian-x86_64-12-bookworm
                - release-debian-armhf-11-bullseye
                - release-debian-arm64-11-bullseye
                - release-debian-x86_64-11-bullseye
                - release-ubuntu-x86_64-2204-jammy
                - release-macos-universal
                - release-msvc-2022
          - deploy-alpha:
              context: celestial-navigation-deployment
              requires: [hold-for-alpha-approval]

orbs:
    win: circleci/windows@5.1.0

commands:
    retain-artifacts:
        steps:
          - run:
              name: Retain package and metadata evidence
              when: always
              command: |
                destination="retained-artifacts/${CIRCLE_JOB}"
                mkdir -p "$destination"
                if test -d build; then
                  for candidate in build/* build/*/* build/*/*/*; do
                    if test -f "$candidate"; then
                      case "$candidate" in
                        *.tar.gz|*.xml|*.exe|*.dmg|*/pkg_version.sh|*/cloudsmith-upload.sh)
                          cp -f "$candidate" "$destination"/
                          ;;
                      esac
                    fi
                  done
                fi
                : > "$destination/SHA256SUMS"
                if command -v sha256sum >/dev/null 2>&1; then
                  for candidate in "$destination"/*; do
                    test "$candidate" = "$destination/SHA256SUMS" || \
                      sha256sum "$candidate" >> "$destination/SHA256SUMS"
                  done
                else
                  for candidate in "$destination"/*; do
                    test "$candidate" = "$destination/SHA256SUMS" || \
                      shasum -a 256 "$candidate" >> "$destination/SHA256SUMS"
                  done
                fi
          - store_artifacts:
              path: retained-artifacts
          - persist_to_workspace:
              root: .
              paths: [retained-artifacts]

# if you want to use a local proxy add Acquire::http::Proxy \"http://192.168.1.1:3142\"; to a file called circleci-cache/apt-proxy. This will require
#    --volume {your local directory}/circleci-cache:/home/circleci/circleci-cache
# on the circleci local command line so that the docker image script can have access to the directory
# if you are on a slow or data limited internet link you can put a copy of master.zip here, or allow one to be downloaded by the script, as it is used by the android builds to
# provide the wxWidgets QT information.

jobs:
## ---------------------
## OpenCPN 5.8 Plugins
## ---------------------
    build-android-arm64:
        docker:
        - image: cimg/android:2023.12-ndk
        resource_class: large
        environment:
        - OCPN_TARGET:  android-arm64
        - DEPLOY_USE_ORB: true
        - INSTALL_PYTHON: true
        steps:
        - checkout
        - run: chmod a+x ci/*.sh
        - run: bash ci/circleci-build-android-arm64.sh
        - retain-artifacts
    build-android-armhf:
        docker:
        - image: cimg/android:2022.12-ndk
        resource_class: large
        environment:
        - OCPN_TARGET:  android-armhf
        - DEPLOY_USE_ORB: true
        - INSTALL_PYTHON: true
        steps:
        - checkout
        - run: chmod a+x ci/*.sh
        - run: bash ci/circleci-build-android-armhf.sh
        - retain-artifacts
    build-macos-universal:
        macos:
            xcode: 15.4.0
        environment:
            OCPN_TARGET: macos
            CMAKE_BUILD_PARALLEL_LEVEL: 2
            WX_VER: 32
            DEPLOY_USE_ORB: false
            INSTALL_PYTHON: false
        steps:
        - checkout
        - run: sudo chmod go+w /usr/local
        - restore_cache:
            key: "{{checksum \"build-deps/macos-cache-stamp\"}}\
              -{{checksum \"cmake/MacosWxwidgets.cmake\"}}\
              -{{checksum \"ci/circleci-build-macos-universal.sh\"}}"
        - run: chmod a+x ci/*.sh
        - run: chmod a+x cmake/*.sh
        - run: ci/circleci-build-macos-universal.sh
        - save_cache:
            key: "{{checksum \"build-deps/macos-cache-stamp\"}}\
              -{{checksum \"cmake/MacosWxwidgets.cmake\"}}\
              -{{checksum \"ci/circleci-build-macos-universal.sh\"}}"
            paths:
              - /tmp/local.cache.tar
              - /Users/distiller/project/cache
        - run: >
              sh -c "otool -L build/*.dylib"
        - run: >
              sh -c "cat build/*.xml"
        - retain-artifacts
    build-msvc-wx32-2022:
        executor:
            name: win/server-2022
            shell: bash.exe
        environment:
        - OCPN_TARGET: MSVC
        - MSVC_VERSION: 2022
        - WX_VER: 32
        - DEPLOY_USE_ORB: false
        steps:
        - checkout
        - run:
            privileged: False
            shell: cmd.exe
            command: ci\circleci-build-msvc.bat
        - retain-artifacts
    build-flatpak-aarch64-2208:
        machine:
            image: ubuntu-2404:current
            resource_class: arm.medium
        environment:
        - OCPN_TARGET:  flatpak
        - BUILD_ARCH: aarch64
        - FLATPAK_BRANCH: stable
        - CLOUDSMITH_PKG_EXT: gz
        - SDK_VER: 22.08
        - DEPLOY_USE_ORB: true
        steps:
        - checkout
        - run: chmod a+x ci/*.sh
        - run:
            command: bash ci/circleci-build-flatpak.sh
        - retain-artifacts
    build-flatpak-x86-2208:
        machine:
            image: ubuntu-2404:current
        environment:
        - OCPN_TARGET:  flatpak
        - BUILD_ARCH: x86_64
        - FLATPAK_BRANCH: stable
        - CLOUDSMITH_PKG_EXT: gz
        - SDK_VER: 22.08
        - DEPLOY_USE_ORB: true
        steps:
        - checkout
        - run: chmod a+x ci/*.sh
        - run:
            command: bash ci/circleci-build-flatpak.sh
            no_output_timeout: 30m
        - retain-artifacts
    build-flatpak-aarch64-2408:
        machine:
            image: ubuntu-2404:current
            resource_class: arm.medium
        environment:
        - OCPN_TARGET:  flatpak
        - BUILD_ARCH: aarch64
        - FLATPAK_BRANCH: stable
        - CLOUDSMITH_PKG_EXT: gz
        - SDK_VER: 24.08
        - DEPLOY_USE_ORB: true
        steps:
        - checkout
        - run: chmod a+x ci/*.sh
        - run:
            command: bash ci/circleci-build-flatpak.sh
        - retain-artifacts
    build-flatpak-x86-2408:
        machine:
            image: ubuntu-2404:current
        environment:
        - OCPN_TARGET:  flatpak
        - BUILD_ARCH: x86_64
        - FLATPAK_BRANCH: stable
        - CLOUDSMITH_PKG_EXT: gz
        - SDK_VER: 24.08
        - DEPLOY_USE_ORB: true
        steps:
        - checkout
        - run: chmod a+x ci/*.sh
        - run:
            command: bash ci/circleci-build-flatpak.sh
            no_output_timeout: 30m
        - retain-artifacts
    build-debian-arm64-13-trixie:
        machine:
            image: ubuntu-2204:current
            resource_class: arm.medium
        environment:
        - OCPN_TARGET=trixie-arm64
        - DOCKER_IMAGE=arm64v8/debian:trixie
        - BUILD_FLAGS=-j3
        - BUILD_ENV=debian
        - WX_VER: 32
        - BUILD_GTK3: true
        - DEPLOY_USE_ORB: true
        steps:
        - checkout
        - run: chmod a+x ./ci/*.sh
        - run:
            command: ci/circleci-build-ubuntu-docker.sh
            no_output_timeout: 30m
        - retain-artifacts
    build-debian-armhf-13-trixie:
        machine:
            image: ubuntu-2204:current
            resource_class: arm.medium
        environment:
        - OCPN_TARGET=trixie-armhf
        - DOCKER_IMAGE=arm32v7/debian:trixie
        - BUILD_FLAGS=-j3
        - BUILD_ENV=debian
        - WX_VER: 32
        - BUILD_GTK3: true
        - DEPLOY_USE_ORB: true
        steps:
        - checkout
        - run: chmod a+x ./ci/*.sh
        - run:
            command: ci/circleci-build-ubuntu-docker.sh
            no_output_timeout: 30m
        - retain-artifacts
    build-debian-x86_64-13-trixie:
        machine:
            image: ubuntu-2404:current
        environment:
        - OCPN_TARGET: trixie
        - BUILD_GTK3: true
        - WX_VER: 32
        - DEPLOY_USE_ORB: true
        - BUILD_ENV=debian
        - DOCKER_IMAGE=debian:trixie
        steps:
        - checkout
        - run: chmod a+x ci/*.sh
        - run:
            command: ci/circleci-build-ubuntu-docker.sh
            no_output_timeout: 30m
        - retain-artifacts
    build-debian-arm64-12-bookworm:
        machine:
            image: ubuntu-2204:current
            resource_class: arm.medium
        environment:
        - OCPN_TARGET=bookworm-arm64
        - DOCKER_IMAGE=arm64v8/debian:bookworm
        - BUILD_FLAGS=-j3
        - BUILD_ENV=debian
        - WX_VER: 32
        - BUILD_GTK3: true
        - DEPLOY_USE_ORB: true
        steps:
        - checkout
        - run: chmod a+x ./ci/*.sh
        - run:
            command: ci/circleci-build-ubuntu-docker.sh
            no_output_timeout: 30m
        - retain-artifacts
    build-debian-armhf-12-bookworm:
        machine:
            image: ubuntu-2204:current
            resource_class: arm.medium
        environment:
        - OCPN_TARGET=bookworm-armhf
        - DOCKER_IMAGE=arm32v7/debian:bookworm
        - BUILD_FLAGS=-j3
        - BUILD_ENV=debian
        - WX_VER: 32
        - BUILD_GTK3: true
        - DEPLOY_USE_ORB: true
        steps:
        - checkout
        - run: chmod a+x ./ci/*.sh
        - run:
            command: ci/circleci-build-ubuntu-docker.sh
            no_output_timeout: 30m
        - retain-artifacts
    build-debian-x86_64-12-bookworm:
        machine:
            image: ubuntu-2404:current
        environment:
        - OCPN_TARGET: bookworm
        - BUILD_GTK3: true
        - WX_VER: 32
        - DEPLOY_USE_ORB: true
        - RUN_DATA_TESTS: true
        - BUILD_ENV=debian
        - DOCKER_IMAGE=debian:bookworm
        steps:
        - checkout
        - run: chmod a+x ci/*.sh
        - run:
            command: ci/circleci-build-ubuntu-docker.sh
            no_output_timeout: 30m
        - retain-artifacts
    build-debian-armhf-11-bullseye:
        machine:
            image: ubuntu-2204:current
            resource_class: arm.medium
        environment:
        - OCPN_TARGET=bullseye-armhf
        - DOCKER_IMAGE=jongough/debian-armhf:bullseye
        - BUILD_FLAGS=-j3
        - BUILD_ENV=debian
        - BUILD_GTK3: true
        - DEPLOY_USE_ORB: true
        steps:
        - checkout
        - run: chmod a+x ./ci/*.sh
        - run:
            command: ci/circleci-build-ubuntu-docker.sh
            no_output_timeout: 30m
        - retain-artifacts
    build-debian-arm64-11-bullseye:
        machine:
            image: ubuntu-2204:current
            resource_class: arm.medium
        environment:
        - OCPN_TARGET=bullseye-arm64
        - DOCKER_IMAGE=arm64v8/debian:bullseye-backports
        - BUILD_FLAGS=-j3
        - BUILD_ENV=debian
        - BUILD_GTK3: true
        - DEPLOY_USE_ORB: true
        steps:
        - checkout
        - run: chmod a+x ./ci/*.sh
        - run:
            command: ci/circleci-build-ubuntu-docker.sh
            no_output_timeout: 30m
        - retain-artifacts
    build-debian-x86_64-11-bullseye:
        docker:
        - image: circleci/buildpack-deps:bullseye-scm
        environment:
        - OCPN_TARGET:  bullseye
        - BUILD_GTK3: true
        - DEPLOY_USE_ORB: true
        - BUILD_ENV=debian
        steps:
        - checkout
        - run: >
            echo "deb-src http://ftp.us.debian.org/debian bullseye main"
            | sudo tee -a /etc/apt/sources.list
        - run: >
            echo "deb-src http://ftp.us.debian.org/debian bullseye-updates main"
            | sudo tee -a /etc/apt/sources.list
        - run: cat /etc/apt/sources.list
        - run: chmod a+x ci/*.sh
        - run: ci/circleci-build-debian.sh
        - retain-artifacts
## KEEP needed for OpenCPN v5.8 Jammy wx32 build
    build-ubuntu-x86_64-2204-jammy:
        docker:
        - image: cimg/base:edge-22.04
        environment:
        - BUILD_GTK3: true
        - WX_VER: 32
        - OCPN_TARGET: jammy
        - DEPLOY_USE_ORB: true
        - BUILD_ENV=ubuntu
        steps:
        - checkout
        - run:
            name: "Update apt sources"
            command: |
              echo "deb-src http://us.archive.ubuntu.com/ubuntu/ jammy main" | sudo tee -a /etc/apt/sources.list
              echo "deb-src http://us.archive.ubuntu.com/ubuntu/ jammy-updates main" | sudo tee -a /etc/apt/sources.list
              echo "deb [trusted=yes] https://ppa.launchpadcontent.net/opencpn/opencpn/ubuntu/ jammy main" | sudo tee -a /etc/apt/sources.list
        - run: cat /etc/apt/sources.list
        - run: chmod a+x ci/*.sh
        - run: ci/circleci-build-debian.sh
        - retain-artifacts
## ---------------------
## OpenCPN 5.6.2 Plugins
## ---------------------

## Appveyor doesn't build for Windows now.
## If below is used, WinXT will not work.
    build-msvc-2022:
        executor:
            name: win/server-2022
            shell: bash.exe
        environment:
        - OCPN_TARGET: MSVC
        - MSVC_VERSION: 2022
        - WX_VER: 31
        - DEPLOY_USE_ORB: false
        steps:
        - checkout
        - run:
            privileged: False
            shell: cmd.exe
            command: ci\circleci-build-msvc.bat
        - retain-artifacts

    deploy-alpha:
        docker:
        - image: cimg/python:3.13
        resource_class: small
        steps:
        - checkout
        - attach_workspace:
            at: .
        - run:
            name: Install Cloudsmith client
            command: python -m pip install cloudsmith-cli
        - run:
            name: Publish approved retained artifacts
            command: bash ci/deploy-reviewed-artifacts.sh
